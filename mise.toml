[tools]
java = "graalvm"
maven = "latest"

[env]
_.file = ".env"

[tasks.test]
alias = "qa"
description = "Run Application Test"
run = "mvn clean test"

[tasks.build]
alias = "qs"
description = "Build the Project Package"
run = "mvn clean package -DskipTests"

[tasks.native]
alias = "qn"
description = "Build GraalVM Native Binary"
run = "mvn clean package -Pnative"

[tasks.run]
alias = "qw"
description = "Run Application"
run = "mvn exec:java"

